name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sentinelai tests migrations scripts
      - name: Frontend/docs drift check
        run: python scripts/sync_docs.py --check
      - name: Tests (includes benchmark regression floors and migration/ORM equality)
        run: pytest --cov=sentinelai --cov-report=term-missing
        env:
          SENTINEL_MONITOR_LOG_LEVEL: WARNING

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinelai:ci .
      - name: Smoke test
        run: |
          docker run -d --name s -p 8000:8000 -e SENTINEL_API_PUBLIC_DEMO=true sentinelai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break || sleep 2; done
          curl -fsS localhost:8000/health | grep -q '"status":"healthy"'
          curl -fsS -X POST localhost:8000/api/v1/analyze -H 'content-type: application/json' \
            -d '{"transaction":{"amount":2000000,"parties":["Sanctioned Russian Bank"]},"customer":{"name":"X"},"enable_llm_analysis":false}' | grep -q BLOCK
