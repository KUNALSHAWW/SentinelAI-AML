[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "2.0.0"
description = "Explainable AML detection: deterministic engine + guarded LLM research agents, with persistent cases and a tamper-evident audit trail"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Kunal Shaw", email = "kunalshawkol16@gmail.com"}]
keywords = ["aml", "anti-money-laundering", "financial-crime", "compliance", "sanctions-screening", "langgraph", "explainable-ai", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # LLM research layer
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-tavily>=0.2.0",
    "ddgs>=9.0.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Config / validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.7.0",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Misc
    "httpx>=0.26.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
huggingface = ["langchain-huggingface>=0.1.0", "huggingface-hub>=0.26.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
all = ["sentinelai[redis,huggingface,dev]"]

[project.scripts]
sentinelai = "sentinelai.cli:main"

[project.urls]
Homepage = "https://github.com/KUNALSHAWW/SentinelAI-AML"
Repository = "https://github.com/KUNALSHAWW/SentinelAI-AML"
Issues = "https://github.com/KUNALSHAWW/SentinelAI-AML/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelai*"]

[tool.setuptools.package-data]
sentinelai = ["data/*.json"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B904", "UP007", "UP006", "UP035", "UP045", "E701", "E702", "E731", "B905", "UP037", "UP017", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinelai"]
branch = true
omit = ["*/tests/*"]
