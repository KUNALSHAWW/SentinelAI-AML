# SentinelAI full stack.   docker compose up -d            -> API + PostgreSQL + Redis
#                          docker compose --profile monitoring up -d   -> + Prometheus + Grafana
services:
  api:
    build: .
    container_name: sentinelai-api
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      # Defaults to development so `docker compose up` works out of the box; set production + API keys for real use.
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-development}
      SENTINEL_API_KEYS: ${SENTINEL_API_KEYS:-}
      SENTINEL_RUN_MIGRATIONS: "true"
      SENTINEL_DB_AUTO_CREATE_TABLES: "false"
      SENTINEL_DB_POSTGRES_HOST: postgres
      SENTINEL_DB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
      REDIS_URL: redis://redis:6379/0
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-ollama}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SENTINEL_LLM_WEB_SEARCH_ENABLED: ${SENTINEL_LLM_WEB_SEARCH_ENABLED:-false}
      SENTINEL_RISK_REGIME: ${SENTINEL_RISK_REGIME:-US_BSA}
      SENTINEL_MONITOR_LOG_FORMAT: json
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [sentinel]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sentinelai-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
      POSTGRES_DB: sentinelai
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [sentinel]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinelai-redis
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [sentinel]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelai-prometheus
    profiles: [monitoring]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [sentinel]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelai-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [sentinel]
    restart: unless-stopped

networks:
  sentinel:
    name: sentinel-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
