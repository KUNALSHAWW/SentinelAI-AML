# Render blueprint: web service + PostgreSQL. See DEPLOY_RENDER.md.
databases:
  - name: sentinelai-db
    plan: free
    databaseName: sentinelai
    user: sentinelai
    ipAllowList: []

services:
  - type: web
    name: sentinelai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    repo: https://github.com/KUNALSHAWW/SentinelAI-AML
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: SENTINEL_ENVIRONMENT, value: production}
      - {key: SENTINEL_RUN_MIGRATIONS, value: "true"}
      - {key: SENTINEL_DB_AUTO_CREATE_TABLES, value: "false"}
      - key: DATABASE_URL
        fromDatabase: {name: sentinelai-db, property: connectionString}
      # Auth: set SENTINEL_API_KEYS="admin:admin:<long-random>,analyst:analyst:<long-random>" in the dashboard.
      - {key: SENTINEL_API_KEYS, sync: false}
      # Public demo: unauthenticated, rate-limited, analysis-only, nothing persisted. Disable for private deployments.
      - {key: SENTINEL_API_PUBLIC_DEMO, value: "true"}
      - {key: SENTINEL_API_CORS_ORIGINS, value: '["*"]'}
      - {key: SENTINEL_API_TRUST_PROXY, value: "true"}
      - {key: SENTINEL_LLM_PROVIDER, value: ollama}
      - {key: OLLAMA_API_KEY, sync: false}
      - {key: OLLAMA_MODEL, value: "gpt-oss:120b"}
      - {key: TAVILY_API_KEY, sync: false}
      # Privacy default: no customer data leaves the service. Opt in per deployment.
      - {key: SENTINEL_LLM_WEB_SEARCH_ENABLED, value: "false"}
      - {key: SENTINEL_MONITOR_LOG_LEVEL, value: INFO}
